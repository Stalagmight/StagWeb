<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StalagMight — Underwater Cave Survey & Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Marks that JS is available. The scroll-reveal states below are gated on
     this, so a visitor without JS gets the content rather than blank panels. -->
<script>document.documentElement.className = 'js';</script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cave-ember-700: #3A251A; --cave-ember-900: #1A120B; --basalt-950: #0F0906;
  --limestone-50: #F3E8D8; --sandstone-200: #C1A07A; --silt-300: #AE8D67;
  --bg: #0e0d0c; --panel: #171615; --border: #2a2826;
  --text-primary: #d5d0ca; --text-secondary: #858280; --accent: #a89060;
  --warning: #b89848; --error: #b85048; --success: #48986a;
  --border-subtle: rgba(243,232,216,0.18); --border-strong: rgba(243,232,216,0.60);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--basalt-950);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
}

a { color: var(--sandstone-200); text-decoration: none; transition: color 0.3s; }
a:hover { color: var(--limestone-50); }

/* ===== NAV ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 1.2rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15,9,6,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}

.nav::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, rgba(15,9,6,0.6), transparent);
  pointer-events: none;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-brand svg { width: 36px; height: 36px; }

.nav-brand span {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--limestone-50);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.nav-links a {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  position: relative;
  padding: 0.25rem 0;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 50%;
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--sandstone-200);
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.3s;
}

.nav-links a:hover { color: var(--limestone-50); }
.nav-links a:hover::after { opacity: 1; }
.nav-links a:focus-visible {
  outline: 2px solid var(--sandstone-200);
  outline-offset: 4px;
}

/* Styled exactly like the other nav links — inline-flex only so the mark sits
   beside the label. It keeps the shared colour, tracking and hover triangle. */
.nav-github {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
}

/* ===== HERO — copy stack, one action, then the app cropped at the fold ===== */
.hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 40%, var(--basalt-950) 100%);
  overflow: hidden;
  padding-top: 7rem;
}

/* Stalactite shapes hanging from top */
.stalactites {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.stalactite {
  position: absolute;
  top: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--sandstone-200), transparent);
  opacity: 0.15;
}

.stalactite::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 16px solid var(--sandstone-200);
  opacity: 0.4;
}

.stalactite:nth-child(1) { left: 5%; height: 35%; animation: drip 8s ease-in-out infinite; }
.stalactite:nth-child(2) { left: 15%; height: 50%; animation: drip 10s ease-in-out 1s infinite; }
.stalactite:nth-child(3) { left: 25%; height: 28%; animation: drip 7s ease-in-out 2s infinite; }
.stalactite:nth-child(4) { left: 38%; height: 42%; animation: drip 9s ease-in-out 0.5s infinite; }
.stalactite:nth-child(5) { left: 52%; height: 55%; animation: drip 11s ease-in-out 3s infinite; }
.stalactite:nth-child(6) { left: 65%; height: 33%; animation: drip 8s ease-in-out 1.5s infinite; }
.stalactite:nth-child(7) { left: 75%; height: 45%; animation: drip 10s ease-in-out 2.5s infinite; }
.stalactite:nth-child(8) { left: 85%; height: 38%; animation: drip 7s ease-in-out 4s infinite; }
.stalactite:nth-child(9) { left: 92%; height: 60%; animation: drip 12s ease-in-out 1s infinite; }
.stalactite:nth-child(10) { left: 48%; height: 30%; animation: drip 6s ease-in-out 3.5s infinite; }

@keyframes drip {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.08); }
}

/* Crystalline pointed shapes */
.crystal-hang {
  position: absolute;
  top: 0;
  clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
  background: linear-gradient(180deg, rgba(193,160,122,0.06), transparent);
  border-bottom: 1px solid rgba(193,160,122,0.1);
}

.crystal-hang:nth-child(1) { left: 8%; width: 120px; height: 200px; }
.crystal-hang:nth-child(2) { left: 30%; width: 80px; height: 150px; }
.crystal-hang:nth-child(3) { right: 20%; width: 100px; height: 180px; }
.crystal-hang:nth-child(4) { right: 5%; width: 60px; height: 130px; }

.hero-content {
  position: relative;
  z-index: 5;
  max-width: 800px;
  padding: 2rem;
}

.hero-mark {
  display: inline-block;
  margin-bottom: 1.1rem;
}

.hero-mark svg {
  width: 76px; height: 76px;
  filter: drop-shadow(0 0 40px rgba(193,160,122,0.3));
}

.hero h1 {
  font-size: clamp(3.5rem, 8vw, 6rem);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  background: linear-gradient(180deg, var(--limestone-50) 0%, var(--sandstone-200) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 1rem;
}

.hero-tagline {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--silt-300);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 1.4rem;
}

.hero-desc {
  font-size: 1.1rem;
  color: var(--text-secondary);
  max-width: 560px;
  margin: 0 auto 2rem;
  line-height: 1.7;
}

/* One button, one text link, one reassurance line — stacked, not side by side,
   so the download is unambiguously the primary action. */
/* Wider gap than the copy above needs: it gives the drips hanging off the
   button room to fade before they reach this text. */
.hero-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.2rem;
}

.btn-download {
  padding: 1rem 2.6rem;
  font-size: 1.05rem;
}

/* ── Stalactites growing off the download button ──
   Negative z-index so they paint behind the in-flow content of .hero-content:
   the button's own gradient hides where they attach, and the GitHub link and
   platform line below stay legible where a long one passes behind them. */
.btn-hang {
  position: relative;
  display: inline-block;
}

.btn-drips {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  height: 0;
  z-index: -1;
  pointer-events: none;
}

.btn-drips i,
.hero-drips i,
.clip-drips i {
  position: absolute;
  top: -2px;                     /* tuck the base under the edge it hangs from */
  display: block;
  /* Fallback silhouette; each formation overrides it with its own profile. */
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  /* Solid where it meets the button, fading out toward the tip — the same
     taper the hero's own stalactites use. It is also what keeps the GitHub
     link and platform line readable: a long drip is already faint by the time
     it reaches them. Masking rather than a gradient background so the fade is
     pure alpha and each drip keeps its own flat colour. */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 28%, rgba(0,0,0,0.55) 62%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, #000 28%, rgba(0,0,0,0.55) 62%, transparent 100%);
}

/* ── Hanging into the left edge of the hero ──
   Confined to the leftmost 10% so it frames the copy rather than crowding it.
   Shades sit just above the ember the hero starts on, same reasoning as the
   button's: relief catching a little light, not a graphic element. */
.hero-drips {
  position: absolute;
  top: 0;
  left: 0;
  width: 10%;
  height: 0;
  z-index: 1;
  pointer-events: none;
}

.hero-drips i:nth-child(1) { left:  2%; width: 14px; height: 196px; background: #452F1E; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.hero-drips i:nth-child(2) { left: 13%; width:  9px; height:  84px; background: #3E2A1A; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.hero-drips i:nth-child(3) { left: 24%; width: 20px; height: 312px; background: #4A3322; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.hero-drips i:nth-child(4) { left: 39%; width: 11px; height: 132px; background: #422C1C; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }
.hero-drips i:nth-child(5) { left: 50%; width:  8px; height:  58px; background: #392619; clip-path: polygon(0 0, 100% 0, 58% 34%, 46% 100%, 38% 40%); }
.hero-drips i:nth-child(6) { left: 60%; width: 16px; height: 244px; background: #503826; clip-path: polygon(0 0, 100% 0, 52% 100%); }
.hero-drips i:nth-child(7) { left: 74%; width: 10px; height: 104px; background: #402B1B; clip-path: polygon(0 0, 100% 0, 34% 100%); }
.hero-drips i:nth-child(8) { left: 85%; width: 13px; height: 168px; background: #472F1F; clip-path: polygon(0 0, 100% 0, 70% 100%); }

/* ── Hanging off the bottom of each animated preview ──
   Below the frame, not inside it: the clip sets overflow:hidden to trim the
   screenshot, so anything within it gets trimmed too. The clump is a sibling of
   the clip, hung from its bottom edge, the same reason the button's drips are a
   sibling of the button. One per clip covering about 15% of its width, at a
   different offset on each so they do not line up down the page. */
.clip-drips {
  position: absolute;
  top: calc(100% - 3px);           /* base tucked under the clip's bottom border */
  width: 15%;
  height: 0;
  pointer-events: none;
}

/* Each clump is arranged differently: its own offset, its own number of
   formations, and its own spacing, widths, heights and shades. Sharing one
   nth-child set made all five identical clumps merely placed in different spots,
   which is exactly what reads as a repeated graphic rather than as rock. */

/* data entry — 5 formations */
.f-row:nth-child(2) .clip-drips { left: 8%; }
.f-row:nth-child(2) .clip-drips i:nth-child(1) { left: 2%; width: 8px; height: 30px; background: #2E2116; clip-path: polygon(0 0, 100% 0, 52% 100%); }
.f-row:nth-child(2) .clip-drips i:nth-child(2) { left: 14%; width: 12px; height: 68px; background: #382818; clip-path: polygon(0 0, 100% 0, 34% 100%); }
.f-row:nth-child(2) .clip-drips i:nth-child(3) { left: 30%; width: 7px; height: 24px; background: #291E14; clip-path: polygon(0 0, 100% 0, 70% 100%); }
.f-row:nth-child(2) .clip-drips i:nth-child(4) { left: 55%; width: 10px; height: 52px; background: #332417; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.f-row:nth-child(2) .clip-drips i:nth-child(5) { left: 76%; width: 6px; height: 18px; background: #2C2015; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.f-row:nth-child(2) .clip-drips i:nth-child(n+6) { display: none; }

/* visual-first editing — 4 formations */
.f-row:nth-child(3) .clip-drips { left: 71%; }
.f-row:nth-child(3) .clip-drips i:nth-child(1) { left: 8%; width: 6px; height: 20px; background: #2A1E14; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.f-row:nth-child(3) .clip-drips i:nth-child(2) { left: 26%; width: 14px; height: 74px; background: #3C2C1D; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.f-row:nth-child(3) .clip-drips i:nth-child(3) { left: 52%; width: 9px; height: 38px; background: #2E2116; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.f-row:nth-child(3) .clip-drips i:nth-child(4) { left: 74%; width: 7px; height: 26px; background: #271C13; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }
.f-row:nth-child(3) .clip-drips i:nth-child(n+5) { display: none; }

/* speleodb — 6 formations */
.f-row:nth-child(4) .clip-drips { left: 34%; }
.f-row:nth-child(4) .clip-drips i:nth-child(1) { left: 0%; width: 7px; height: 22px; background: #2C2015; clip-path: polygon(0 0, 100% 0, 34% 100%); }
.f-row:nth-child(4) .clip-drips i:nth-child(2) { left: 12%; width: 9px; height: 44px; background: #342518; clip-path: polygon(0 0, 100% 0, 70% 100%); }
.f-row:nth-child(4) .clip-drips i:nth-child(3) { left: 24%; width: 6px; height: 16px; background: #251C14; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.f-row:nth-child(4) .clip-drips i:nth-child(4) { left: 38%; width: 11px; height: 62px; background: #3A2B1C; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.f-row:nth-child(4) .clip-drips i:nth-child(5) { left: 56%; width: 8px; height: 34px; background: #2E2116; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.f-row:nth-child(4) .clip-drips i:nth-child(6) { left: 72%; width: 6px; height: 20px; background: #291E14; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }

/* dive planning — 3 formations */
.f-row:nth-child(5) .clip-drips { left: 55%; }
.f-row:nth-child(5) .clip-drips i:nth-child(1) { left: 6%; width: 13px; height: 70px; background: #382818; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.f-row:nth-child(5) .clip-drips i:nth-child(2) { left: 40%; width: 8px; height: 28px; background: #2D2015; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }
.f-row:nth-child(5) .clip-drips i:nth-child(3) { left: 68%; width: 10px; height: 46px; background: #332417; clip-path: polygon(0 0, 100% 0, 58% 34%, 46% 100%, 38% 40%); }
.f-row:nth-child(5) .clip-drips i:nth-child(n+4) { display: none; }

/* import/export — 5 formations */
.f-row:nth-child(6) .clip-drips { left: 19%; }
.f-row:nth-child(6) .clip-drips i:nth-child(1) { left: 4%; width: 10px; height: 56px; background: #302217; clip-path: polygon(0 0, 100% 0, 70% 100%); }
.f-row:nth-child(6) .clip-drips i:nth-child(2) { left: 22%; width: 6px; height: 20px; background: #271C13; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.f-row:nth-child(6) .clip-drips i:nth-child(3) { left: 44%; width: 12px; height: 66px; background: #3A2B1C; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.f-row:nth-child(6) .clip-drips i:nth-child(4) { left: 62%; width: 7px; height: 26px; background: #2C2015; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.f-row:nth-child(6) .clip-drips i:nth-child(5) { left: 82%; width: 9px; height: 40px; background: #2E2116; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }
.f-row:nth-child(6) .clip-drips i:nth-child(n+6) { display: none; }

/* Clustered in three groups rather than spread evenly — a formation grows in
   clumps, and an even comb across the whole edge reads as a border treatment.
   Shades sit just above the hero background behind them (about #18110A at this
   height), so they read as relief catching a little light rather than as bright
   metal competing with the button. Widths, heights and tones all vary. */

/* left clump */
.btn-drips i:nth-child(1)  { left:  9%;   width:  9px; height:  96px; background: #2E2116; clip-path: polygon(0 0, 100% 0, 52% 100%); }
.btn-drips i:nth-child(2)  { left: 13%;   width: 12px; height: 148px; background: #382818; clip-path: polygon(0 0, 100% 0, 34% 100%); }
.btn-drips i:nth-child(3)  { left: 16.5%; width:  6px; height:  40px; background: #291E14; clip-path: polygon(0 0, 100% 0, 70% 100%); }
.btn-drips i:nth-child(4)  { left: 21%;   width:  8px; height:  70px; background: #332417; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.btn-drips i:nth-child(5)  { left: 25%;   width:  6px; height:  26px; background: #2C2015; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }

/* centre clump */
.btn-drips i:nth-child(6)  { left: 44%;   width:  7px; height:  34px; background: #352618; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.btn-drips i:nth-child(7)  { left: 48%;   width: 11px; height: 118px; background: #3C2C1D; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }
.btn-drips i:nth-child(8)  { left: 51.5%; width:  8px; height:  62px; background: #2E2116; clip-path: polygon(0 0, 100% 0, 58% 34%, 46% 100%, 38% 40%); }
.btn-drips i:nth-child(9)  { left: 56%;   width:  6px; height:  22px; background: #271C13; clip-path: polygon(0 0, 100% 0, 52% 100%); }

/* right clump */
.btn-drips i:nth-child(10) { left: 72%;   width:  8px; height:  54px; background: #302217; clip-path: polygon(0 0, 100% 0, 34% 100%); }
.btn-drips i:nth-child(11) { left: 76%;   width: 13px; height: 138px; background: #3A291A; clip-path: polygon(0 0, 100% 0, 70% 100%); }
.btn-drips i:nth-child(12) { left: 80%;   width:  6px; height:  30px; background: #2A1E14; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.btn-drips i:nth-child(13) { left: 84.5%; width:  9px; height:  88px; background: #342518; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.btn-drips i:nth-child(14) { left: 88%;   width:  7px; height:  44px; background: #2D2015; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.btn-drips i:nth-child(15) { display: none; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }

.hero-ghost-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  color: var(--silt-300);
  position: relative;
  transition: color 0.3s ease;
}

/* A dim halo behind the label. The drips sit at z-index -1 and this comes later
   in the document, so at the same level it paints over them — dimming whatever
   passes behind the text instead of dimming every drip everywhere. */
.hero-ghost-link::before {
  content: '';
  position: absolute;
  inset: -1rem -3rem;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at center,
              rgba(15,9,6,0.82) 0%, rgba(15,9,6,0.66) 38%,
              rgba(15,9,6,0.32) 66%, rgba(15,9,6,0) 100%);
}

.hero-ghost-link:hover { color: var(--limestone-50); }
.hero-ghost-link svg { flex: 0 0 auto; }
.hero-ghost-arrow { font-size: 0.8em; opacity: 0.7; }
.hero-ghost-link:focus-visible,
.btn-download:focus-visible {
  outline: 2px solid var(--sandstone-200);
  outline-offset: 4px;
}

.hero-platforms {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
  position: relative;
  opacity: 0.8;
}

.hero-platforms::before {
  content: '';
  position: absolute;
  inset: -0.8rem -2.6rem;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at center,
              rgba(15,9,6,0.76) 0%, rgba(15,9,6,0.5) 50%, rgba(15,9,6,0) 100%);
}

/* ===== HERO SHOT — the whole app preview, shown in full ===== */
.hero-shot {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 1240px;
  margin: 3rem auto 0;
  padding: 0 2rem 5rem;
}

.hero-shot-frame {
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: 0 30px 90px rgba(0,0,0,0.75);
}

.hero-shot-bar {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.6rem 0.9rem;
  background: rgba(23,22,21,0.95);
  border-bottom: 1px solid var(--border);
}

.hero-shot-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border-subtle);
  flex: 0 0 auto;
}

.hero-shot-title {
  margin-left: 0.6rem;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: var(--text-secondary);
}

/* A real screenshot rather than a live iframe: the intrinsic width/height on
   the <img> reserves the right box before it loads, so nothing shifts. */
.hero-shot-viewport { width: 100%; }
.hero-shot-viewport img {
  display: block;
  width: 100%;
  height: auto;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.85rem 2.2rem;
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
  clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
}

.btn-primary {
  background: linear-gradient(90deg, var(--limestone-50), var(--sandstone-200));
  color: var(--basalt-950);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(193,160,122,0.3);
  /* Restate the dark ink. The buttons are anchors, and the global
     `a:hover { color: limestone }` outweighs `.btn-primary` on specificity —
     which turned the label near-white on a near-white gradient on hover. */
  color: var(--basalt-950);
}

.btn-secondary {
  background: transparent;
  color: var(--limestone-50);
  border: 2px solid var(--border-subtle);
  clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
}

.btn-secondary:hover {
  border-color: var(--sandstone-200);
  background: rgba(193,160,122,0.08);
  color: var(--limestone-50);
}

/* ===== SECTIONS ===== */
.section {
  padding: 6rem 2rem;
  position: relative;
}

.section-header {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 4rem;
}

.section-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.25em;
  margin-bottom: 1rem;
}

.section-header h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--limestone-50);
  margin-bottom: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.section-header p {
  color: var(--text-secondary);
  font-size: 1.05rem;
  line-height: 1.7;
}

/* ===== FEATURES — one colour zone per feature =====
   Each feature owns a full-bleed band of its own colour, and the seam between
   two bands is a row of stalactite points — the same device the CTA and footer
   already use: a strip at the top of the block, filled with the colour *above*
   it, clipped to a polygon. Zones step steadily darker down the page, so
   reading the list feels like going deeper rather than like six flat cards. */
.features-section {
  position: relative;
  background: var(--basalt-950);
  padding: 0;
}

.fs-head {
  text-align: center;
  max-width: 60ch;
  margin: 0 auto;
  padding: 6rem 2rem 3rem;
}
.fs-head h2 {
  font-size: clamp(2rem, 4vw, 2.8rem);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--limestone-50);
}
.fs-head p { color: var(--text-secondary); margin-top: 0.6rem; }

/* The zone. Full width, so the colour band reaches both edges; the content
   inside is what stays on the measure. */
.f-row {
  position: relative;
  background: var(--zone);
  padding: 4rem 0;
}

/* The jagged seam. Sits at the top of each zone carrying the previous zone's
   colour, so the boundary between the two is a row of points. */
.f-row::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 54px;
  background: var(--zone-prev);
  clip-path: polygon(0 0, 100% 0, 100% 30%, 93% 100%, 79% 34%, 64% 100%, 50% 34%, 36% 100%, 21% 34%, 7% 100%, 0 30%);
  pointer-events: none;
  z-index: 0;
}

/* Six steps down from the ember of the hero to near-black at the CTA. The
   first zone's "previous" colour is the basalt the hero ends on. */
.f-row:nth-child(1) { --zone: #2A1E15; --zone-prev: var(--basalt-950); }
.f-row:nth-child(2) { --zone: #241A12; --zone-prev: #2A1E15; }
.f-row:nth-child(3) { --zone: #1E1610; --zone-prev: #241A12; }
.f-row:nth-child(4) { --zone: #18120D; --zone-prev: #1E1610; }
.f-row:nth-child(5) { --zone: #120E0A; --zone-prev: #18120D; }
.f-row:nth-child(6) { --zone: #0C0907; --zone-prev: #120E0A; }

/* Content sits above the seam, and on the measure. */
.f-row-in {
  position: relative;
  z-index: 1;
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 2rem;
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: clamp(2rem, 5vw, 4.5rem);
  align-items: center;
}

.f-row-in > .f-visual { grid-row: 1; grid-column: 1; }
.f-row-in > .f-body   { grid-row: 1; grid-column: 2; }

/* Flip every other row. The track widths swap along with the content, so the
   media always gets the wider column — alternating with `order` alone would
   hand the copy the narrow track on every second row and squash it. DOM order
   is unchanged, so reading order for assistive tech is too. */
.f-row:nth-child(even) .f-row-in { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); }
.f-row:nth-child(even) .f-row-in > .f-visual { grid-column: 2; }
.f-row:nth-child(even) .f-row-in > .f-body   { grid-column: 1; }

/* A media row gives the recording the wider track; a mark row gives it to the
   copy, since a glyph does not need the room. */
.f-row-media .f-row-in { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); }
.f-row-media:nth-child(even) .f-row-in { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }

/* A row with nothing to show gets no visual column — a half-empty row reads as
   a failed image load. Its copy runs to a comfortable measure instead. */
.f-row-text .f-row-in { display: block; }
.f-row-text .f-body p { max-width: 78ch; }

/* No plate — the mark simply centres in its column. Positioned so a formation
   can hang off the bottom of the clip inside it. */
.f-visual { position: relative; display: grid; place-items: center; }
.f-visual svg {
  width: 104px; height: 104px;
  stroke: var(--sandstone-200);
  fill: none;
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.f-visual .icon-mark { width: 116px; height: 116px; }

.f-clip {
  position: relative;
  z-index: 1;                      /* covers where the formation attaches */
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;                /* also trims the drips to the frame */
  background: var(--panel);
  box-shadow: 0 18px 50px -24px rgba(0,0,0,0.85);
}
.f-clip picture { display: block; }
.f-clip img { display: block; width: 100%; height: auto; }

/* Every row carries its mark beside the title, since five of six have a
   recording in the visual column and no large glyph to stand in for it. */
.f-head {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  margin-bottom: 0.7rem;
}
.f-head h3 { margin-bottom: 0; }
.f-head .f-head-ico {
  width: 30px; height: 30px;
  flex: 0 0 auto;
  stroke: var(--sandstone-200);
  fill: none;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.f-head .icon-mark { width: 34px; height: 34px; flex: 0 0 auto; }

.f-body h3 {
  font-size: clamp(1.35rem, 2.4vw, 1.75rem);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--limestone-50);
}
.f-body p {
  color: var(--text-secondary);
  font-size: 1.03rem;
  max-width: 56ch;
}

/* Real brand marks ship as monochrome PNGs, so they are masks rather than
   <img> — that way they take the accent colour like the stroked icons. */
.icon-mark {
  display: block;
  background-color: var(--sandstone-200);
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center;  mask-position: center;
  -webkit-mask-size: contain;     mask-size: contain;
}
.icon-speleodb {
  -webkit-mask-image: url('/speleodb-logo.png');
  mask-image: url('/speleodb-logo.png');
}

/* ===== CTA ===== */
.cta-section {
  text-align: center;
  padding: 8rem 2rem;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 100%);
}

/* Stalactites hanging into CTA */
.cta-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 80px;
  background: #0C0907;                 /* the last feature zone */
  clip-path: polygon(0 0, 100% 0, 90% 100%, 70% 50%, 50% 100%, 30% 50%, 10% 100%);
}

.cta-content {
  position: relative;
  z-index: 2;
  max-width: 600px;
  margin: 0 auto;
}

.cta-content h2 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}

.cta-content p {
  color: var(--silt-300);
  font-size: 1.1rem;
  margin-bottom: 2.5rem;
  line-height: 1.7;
}

.cta-buttons {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

.cta-platforms {
  display: flex;
  gap: 2rem;
  justify-content: center;
  margin-top: 2rem;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.cta-platforms span {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

/* ===== FOOTER ===== */
.footer {
  background: var(--basalt-950);
  border-top: 1px solid var(--border);
  padding: 3rem 2rem;
  position: relative;
}

.footer::before {
  content: '';
  position: absolute;
  top: -20px; left: 0; right: 0;
  height: 20px;
  background: var(--cave-ember-900);
  clip-path: polygon(0 0, 100% 0, 95% 100%, 85% 40%, 75% 100%, 65% 40%, 55% 100%, 45% 40%, 35% 100%, 25% 40%, 15% 100%, 5% 40%);
  opacity: 0.3;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 2rem;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.footer-brand svg { width: 28px; height: 28px; }

.footer-brand span {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--limestone-50);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Wraps, and centres when it does — five links in one row is wider than a
   phone, which used to push the whole document into horizontal scroll. */
.footer-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem 2rem;
  list-style: none;
}

.footer-links a {
  font-size: 0.85rem;
  color: var(--text-secondary);
  transition: color 0.3s;
}

.footer-links a:hover { color: var(--limestone-50); }

.footer-copy {
  color: var(--text-secondary);
  font-size: 0.8rem;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .nav-links { display: none; }
  /* One column, alternation dropped — flipping sides means nothing once
     everything is stacked. Every variant collapses to the same single track. */
  .f-row-in,
  .f-row:nth-child(even) .f-row-in,
  .f-row-media .f-row-in,
  .f-row-media:nth-child(even) .f-row-in {
    grid-template-columns: 1fr;
    gap: 1.5rem;
    padding: 0 1.25rem;
  }
  .f-row-in > .f-visual,
  .f-row:nth-child(even) .f-row-in > .f-visual { grid-row: 1; grid-column: 1; }
  .f-row-in > .f-body,
  .f-row:nth-child(even) .f-row-in > .f-body { grid-row: 2; grid-column: 1; }
  .f-row { padding: 2.8rem 0; }
  /* Shorter zones need a shallower seam or the points eat the content. */
  .f-row::before { height: 34px; }
  .f-visual { justify-items: start; }
  .f-visual svg { width: 68px; height: 68px; }
  .f-visual .icon-mark { width: 76px; height: 76px; }
  .fs-head { padding: 4.5rem 1.25rem 2rem; }
}

@media (max-width: 900px) {
  .hero { padding-top: 7rem; }
  .hero-shot { padding: 0 1.25rem 3rem; margin-top: 2.5rem; }
  .features-section { padding-top: 4.5rem; }
}

@media (max-width: 600px) {
  .hero h1 { font-size: 2.5rem; letter-spacing: 0.08em; }
  .hero-tagline { font-size: 1rem; }
  .section { padding: 4rem 1.25rem; }
  .btn { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
  .btn-download { padding: 0.9rem 1.9rem; font-size: 0.95rem; }
  .hero-shot-title { display: none; }
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.js .reveal {
  opacity: 0;
  transform: translateY(30px);
}

.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* ===== REDUCED MOTION =====
   The reveals and the dripping stalactites are decorative, so when motion is
   unwelcome the page becomes the still version of itself — nothing is hidden
   and nothing waits on an observer. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
  .js .reveal,
  .js .feature-card {
    opacity: 1 !important;
    transform: none !important;
  }
}
</style>
</head>
<body>

<load src="partials/nav.html" />
<load src="partials/hero.html" />
<load src="partials/features.html" />
<load src="partials/cta.html" />
<load src="partials/footer.html" />

<script>
// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('revealed');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.reveal').forEach(el => {
  observer.observe(el);
});



// Label the download button for the visitor's own platform. Falls back to the
// generic "Download for Desktop" already in the markup if detection fails, so
// the button is never blank or wrong-looking without JS.
(() => {
  const label = document.getElementById('heroDownloadLabel');
  if (!label) return;
  const ua = navigator.userAgent;
  const plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  const hay = (plat + ' ' + ua).toLowerCase();
  let os = null;
  if (/mac|darwin/.test(hay) && !/iphone|ipad/.test(hay)) os = 'macOS';
  else if (/win/.test(hay)) os = 'Windows';
  else if (/linux|x11|ubuntu|fedora|debian/.test(hay) && !/android/.test(hay)) os = 'Linux';
  if (os) label.textContent = 'Download for ' + os;
})();

// Only the feature clip nearest the middle of the viewport animates; the others
// show their first frame. Five looping WebPs decoding at once is wasted work and
// splits attention, and an animated WebP cannot be paused — so the source is
// swapped for the still instead. A clip therefore also downloads its animation
// only once it has actually been looked at.
(() => {
  const imgs = [...document.querySelectorAll('.f-clip img[data-anim]')];
  if (imgs.length < 2) return;
  // Under reduced motion the <picture><source> already serves stills, and a
  // matching <source> beats anything set on the img — nothing to manage here.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Opacity tracks distance from the middle of the viewport, so a clip fades up
  // as it approaches being the closest one and fades back as it leaves. It also
  // hides the handover: the swap between animation and still happens at the
  // moment two clips are equidistant, when both are equally faded, so the change
  // of content is not something you catch.
  const FLOOR = 0.28;         // how dim a clip gets once well away from centre
  const REACH = 0.62;         // fade distance as a fraction of viewport height

  let queued = false;
  const update = () => {
    queued = false;
    const middle = window.innerHeight / 2;
    const reach = window.innerHeight * REACH;
    let winner = null, best = Infinity;
    const dist = new Map();

    for (const img of imgs) {
      const r = img.getBoundingClientRect();
      const d = Math.abs(r.top + r.height / 2 - middle);
      dist.set(img, d);
      if (r.bottom <= 0 || r.top >= window.innerHeight) continue;   // off screen
      if (d < best) { best = d; winner = img; }
    }

    for (const img of imgs) {
      // Smoothstep rather than linear: holds close to full opacity while the
      // clip is near the middle, and does its falling off in the mid distance.
      const t = Math.min(1, dist.get(img) / reach);
      const eased = t * t * (3 - 2 * t);
      // the whole visual, so the formation hanging off the clip dims with it
      img.closest('.f-visual').style.opacity = (1 - eased * (1 - FLOOR)).toFixed(3);

      const want = img === winner ? img.dataset.anim : img.dataset.still;
      // Only assign on a real change; re-assigning would restart the loop.
      if (!img.getAttribute('src').endsWith(want)) img.setAttribute('src', want);
    }
  };
  const onScroll = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();

// Fit every scaled-down iframe (the hero app shot and the four dialog
// previews) to the width its container actually got. Each element declares its
// own native width, so one routine handles all of them and nothing is cropped
// horizontally or letterboxed at any viewport size.
(() => {
  const targets = [
  ].flatMap(([sel, native]) =>
    [...document.querySelectorAll(sel)].map(box => ({ box, native }))
  );
  if (!targets.length) return;

  const fit = () => {
    for (const { box, native } of targets) {
      const frame = box.querySelector('iframe');
      const w = box.clientWidth;
      if (frame && w) frame.style.transform = 'scale(' + (w / native).toFixed(4) + ')';
    }
  };

  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(fit);
    targets.forEach(({ box }) => ro.observe(box));
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
