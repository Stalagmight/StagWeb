<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StalagMight — Underwater Cave Survey & Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Marks that JS is available. The scroll-reveal states below are gated on
     this, so a visitor without JS gets the content rather than blank panels. -->
<script>document.documentElement.className = 'js';</script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cave-ember-700: #3A251A; --cave-ember-900: #1A120B; --basalt-950: #0F0906;
  --limestone-50: #F3E8D8; --sandstone-200: #C1A07A; --silt-300: #AE8D67;
  --bg: #0e0d0c; --panel: #171615; --border: #2a2826;
  --text-primary: #d5d0ca; --text-secondary: #858280; --accent: #a89060;
  --warning: #b89848; --error: #b85048; --success: #48986a;
  --border-subtle: rgba(243,232,216,0.18); --border-strong: rgba(243,232,216,0.60);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--basalt-950);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
}

a { color: var(--sandstone-200); text-decoration: none; transition: color 0.3s; }
a:hover { color: var(--limestone-50); }

/* ===== NAV ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 1.2rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15,9,6,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}

.nav::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, rgba(15,9,6,0.6), transparent);
  pointer-events: none;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-brand svg { width: 36px; height: 36px; }

.nav-brand span {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--limestone-50);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.nav-links a {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  position: relative;
  padding: 0.25rem 0;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 50%;
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--sandstone-200);
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.3s;
}

.nav-links a:hover { color: var(--limestone-50); }
.nav-links a:hover::after { opacity: 1; }
.nav-links a:focus-visible {
  outline: 2px solid var(--sandstone-200);
  outline-offset: 4px;
}

/* GitHub sits in the nav as a bordered pill so it reads as a destination
   rather than another in-page anchor. */
.nav-github {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.3rem 0.85rem !important;
  border: 1px solid var(--border-subtle);
  color: var(--limestone-50) !important;
  transition: border-color 0.3s ease, background 0.3s ease;
}
.nav-github:hover {
  border-color: var(--sandstone-200);
  background: rgba(193,160,122,0.08);
}
.nav-github::after { display: none; }

/* ===== HERO — copy stack, one action, then the app cropped at the fold ===== */
.hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 40%, var(--basalt-950) 100%);
  overflow: hidden;
  padding-top: 7rem;
}

/* Stalactite shapes hanging from top */
.stalactites {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.stalactite {
  position: absolute;
  top: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--sandstone-200), transparent);
  opacity: 0.15;
}

.stalactite::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 16px solid var(--sandstone-200);
  opacity: 0.4;
}

.stalactite:nth-child(1) { left: 5%; height: 35%; animation: drip 8s ease-in-out infinite; }
.stalactite:nth-child(2) { left: 15%; height: 50%; animation: drip 10s ease-in-out 1s infinite; }
.stalactite:nth-child(3) { left: 25%; height: 28%; animation: drip 7s ease-in-out 2s infinite; }
.stalactite:nth-child(4) { left: 38%; height: 42%; animation: drip 9s ease-in-out 0.5s infinite; }
.stalactite:nth-child(5) { left: 52%; height: 55%; animation: drip 11s ease-in-out 3s infinite; }
.stalactite:nth-child(6) { left: 65%; height: 33%; animation: drip 8s ease-in-out 1.5s infinite; }
.stalactite:nth-child(7) { left: 75%; height: 45%; animation: drip 10s ease-in-out 2.5s infinite; }
.stalactite:nth-child(8) { left: 85%; height: 38%; animation: drip 7s ease-in-out 4s infinite; }
.stalactite:nth-child(9) { left: 92%; height: 60%; animation: drip 12s ease-in-out 1s infinite; }
.stalactite:nth-child(10) { left: 48%; height: 30%; animation: drip 6s ease-in-out 3.5s infinite; }

@keyframes drip {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.08); }
}

/* Crystalline pointed shapes */
.crystal-hang {
  position: absolute;
  top: 0;
  clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
  background: linear-gradient(180deg, rgba(193,160,122,0.06), transparent);
  border-bottom: 1px solid rgba(193,160,122,0.1);
}

.crystal-hang:nth-child(1) { left: 8%; width: 120px; height: 200px; }
.crystal-hang:nth-child(2) { left: 30%; width: 80px; height: 150px; }
.crystal-hang:nth-child(3) { right: 20%; width: 100px; height: 180px; }
.crystal-hang:nth-child(4) { right: 5%; width: 60px; height: 130px; }

.hero-content {
  position: relative;
  z-index: 5;
  max-width: 800px;
  padding: 2rem;
}

.hero-mark {
  display: inline-block;
  margin-bottom: 1.1rem;
}

.hero-mark svg {
  width: 76px; height: 76px;
  filter: drop-shadow(0 0 40px rgba(193,160,122,0.3));
}

.hero h1 {
  font-size: clamp(3.5rem, 8vw, 6rem);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  background: linear-gradient(180deg, var(--limestone-50) 0%, var(--sandstone-200) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 1rem;
}

.hero-tagline {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--silt-300);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 1.4rem;
}

.hero-desc {
  font-size: 1.1rem;
  color: var(--text-secondary);
  max-width: 560px;
  margin: 0 auto 2rem;
  line-height: 1.7;
}

/* One button, one text link, one reassurance line — stacked, not side by side,
   so the download is unambiguously the primary action. */
.hero-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.1rem;
}

.btn-download {
  padding: 1rem 2.6rem;
  font-size: 1.05rem;
}

.hero-ghost-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  transition: color 0.3s ease;
}

.hero-ghost-link:hover { color: var(--limestone-50); }
.hero-ghost-link svg { flex: 0 0 auto; }
.hero-ghost-arrow { font-size: 0.8em; opacity: 0.7; }
.hero-ghost-link:focus-visible,
.btn-download:focus-visible {
  outline: 2px solid var(--sandstone-200);
  outline-offset: 4px;
}

.hero-platforms {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
  opacity: 0.65;
}

/* ===== HERO SHOT — the whole app preview, shown in full ===== */
.hero-shot {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 1240px;
  margin: 3rem auto 0;
  padding: 0 2rem 5rem;
}

.hero-shot-frame {
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: 0 30px 90px rgba(0,0,0,0.75);
}

.hero-shot-bar {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.6rem 0.9rem;
  background: rgba(23,22,21,0.95);
  border-bottom: 1px solid var(--border);
}

.hero-shot-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border-subtle);
  flex: 0 0 auto;
}

.hero-shot-title {
  margin-left: 0.6rem;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: var(--text-secondary);
}

/* The app preview is 1440×900 native. Holding that exact aspect ratio means
   the whole screenshot is visible at any width — no crop, no letterboxing. */
.hero-shot-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 1440 / 900;
  overflow: hidden;
}

.hero-shot-viewport iframe {
  position: absolute;
  top: 0; left: 0;
  width: 1440px;
  height: 900px;
  border: none;
  transform-origin: top left;
  pointer-events: none;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.85rem 2.2rem;
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
  clip-path: polygon(0% 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 0% 100%, 10px 50%);
}

.btn-primary {
  background: linear-gradient(90deg, var(--limestone-50), var(--sandstone-200));
  color: var(--basalt-950);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(193,160,122,0.3);
}

.btn-secondary {
  background: transparent;
  color: var(--limestone-50);
  border: 2px solid var(--border-subtle);
  clip-path: polygon(0% 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 0% 100%, 10px 50%);
}

.btn-secondary:hover {
  border-color: var(--sandstone-200);
  background: rgba(193,160,122,0.08);
}

/* ===== SECTIONS ===== */
.section {
  padding: 6rem 2rem;
  position: relative;
}

.section-header {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 4rem;
}

.section-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.25em;
  margin-bottom: 1rem;
}

.section-header h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--limestone-50);
  margin-bottom: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.section-header p {
  color: var(--text-secondary);
  font-size: 1.05rem;
  line-height: 1.7;
}

/* ===== FEATURES — alternating rows =====
   Plain document scroll. Each feature is a full-width row with the mark on one
   side and the copy on the other, flipping sides down the list. Nothing here
   depends on JS beyond the shared fade-in. */
.features-section {
  position: relative;
  background: var(--bg);
  padding: 6rem 2rem 4rem;
}

.fs-head { text-align: center; max-width: 60ch; margin: 0 auto 1rem; }
.fs-head h2 {
  font-size: clamp(2rem, 4vw, 2.8rem);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--limestone-50);
}
.fs-head p { color: var(--text-secondary); margin-top: 0.6rem; }

.f-rows { max-width: 1140px; margin: 0 auto; }

.f-row {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: clamp(2rem, 5vw, 4.5rem);
  align-items: center;
  padding: 3.4rem 0;
  border-bottom: 1px solid var(--border);
}
.f-row:last-child { border-bottom: 0; }

.f-row > .f-visual { grid-row: 1; grid-column: 1; }
.f-row > .f-body   { grid-row: 1; grid-column: 2; }

/* Flip every other row. The track widths swap along with the content, so the
   mark always sits in the narrower column and the copy always gets the wider
   one — alternating with `order` alone would hand the text the narrow track on
   every second row and squash it. DOM order stays mark-then-copy either way,
   so the reading order a screen reader gets never changes. */
.f-row:nth-child(even) { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); }
.f-row:nth-child(even) > .f-visual { grid-column: 2; }
.f-row:nth-child(even) > .f-body   { grid-column: 1; }

/* No plate — the mark simply centres in its column. It carries the row on its
   own, so it is sized up from what it was inside the box. */
.f-visual {
  display: grid;
  place-items: center;
}
.f-visual svg {
  width: 104px; height: 104px;
  stroke: var(--sandstone-200);
  fill: none;
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.f-visual .icon-mark { width: 116px; height: 116px; }

.f-body h3 {
  font-size: clamp(1.35rem, 2.4vw, 1.75rem);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--limestone-50);
  margin-bottom: 0.7rem;
}
.f-body p {
  color: var(--text-secondary);
  font-size: 1.03rem;
  max-width: 56ch;
}

/* Real brand marks ship as monochrome PNGs, so they are masks rather than
   <img> — that way they take the accent colour like the stroked icons. */
.icon-mark {
  display: block;
  background-color: var(--sandstone-200);
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center;  mask-position: center;
  -webkit-mask-size: contain;     mask-size: contain;
}
.icon-speleodb {
  -webkit-mask-image: url('/speleodb-logo.png');
  mask-image: url('/speleodb-logo.png');
}

/* ===== WORKFLOW — Dialog Previews ===== */
.workflow-section {
  background: var(--basalt-950);
  padding: 6rem 2rem 8rem;
  position: relative;
}

/* Pointed top edge */
.workflow-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 60px;
  background: var(--bg);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

.workflow-steps {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 4rem;
}

.workflow-step {
  display: flex;
  align-items: flex-start;
  gap: 3rem;
}

.workflow-step.reverse {
  flex-direction: row-reverse;
}

/* Dialog preview iframe container.
   Each dialog has its own native size; the container keeps that aspect ratio
   and caps at the 0.55 scale it was designed for, but is free to shrink below
   it. The scale itself is set from the measured width in JS — hard-coding both
   a pixel width and a fixed scale is what used to force the whole page wider
   than a phone screen. */
.dialog-preview {
  width: 100%;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  position: relative;
}

.dialog-preview iframe {
  border: none;
  display: block;
  transform-origin: top left;
}

/* Dialog #1: 680 × 700 native */
.dialog-preview[data-dialog="01"] {
  max-width: 374px;
  aspect-ratio: 680 / 700;
}
.dialog-preview[data-dialog="01"] iframe { width: 680px; height: 700px; }

/* Dialog #2: 1100 × 800 native */
.dialog-preview[data-dialog="02"] {
  max-width: 605px;
  aspect-ratio: 1100 / 800;
}
.dialog-preview[data-dialog="02"] iframe { width: 1100px; height: 800px; }

/* Dialog #3: 1000 × 700 native */
.dialog-preview[data-dialog="03"] {
  max-width: 550px;
  aspect-ratio: 1000 / 700;
}
.dialog-preview[data-dialog="03"] iframe { width: 1000px; height: 700px; }

/* Dialog #4: 1000 × 700 native */
.dialog-preview[data-dialog="04"] {
  max-width: 550px;
  aspect-ratio: 1000 / 700;
}
.dialog-preview[data-dialog="04"] iframe { width: 1000px; height: 700px; }

/* Step info text */
.workflow-step-info {
  flex: 1;
  padding-top: 1rem;
}

.workflow-step-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--limestone-50);
  background: var(--cave-ember-900);
  border: 1px solid var(--sandstone-200);
  clip-path: polygon(50% 100%, 0% 20%, 0% 0%, 100% 0%, 100% 20%);
  padding-bottom: 8px;
  margin-bottom: 1rem;
}

.workflow-step-info h3 {
  font-size: 1.3rem;
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.75rem;
}

.workflow-step-info p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.7;
}

/* ===== CTA ===== */
.cta-section {
  text-align: center;
  padding: 8rem 2rem;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 100%);
}

/* Stalactites hanging into CTA */
.cta-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 80px;
  background: var(--panel);
  clip-path: polygon(0 0, 100% 0, 90% 100%, 70% 50%, 50% 100%, 30% 50%, 10% 100%);
}

.cta-content {
  position: relative;
  z-index: 2;
  max-width: 600px;
  margin: 0 auto;
}

.cta-content h2 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}

.cta-content p {
  color: var(--silt-300);
  font-size: 1.1rem;
  margin-bottom: 2.5rem;
  line-height: 1.7;
}

.cta-buttons {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

.cta-platforms {
  display: flex;
  gap: 2rem;
  justify-content: center;
  margin-top: 2rem;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.cta-platforms span {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

/* ===== FOOTER ===== */
.footer {
  background: var(--basalt-950);
  border-top: 1px solid var(--border);
  padding: 3rem 2rem;
  position: relative;
}

.footer::before {
  content: '';
  position: absolute;
  top: -20px; left: 0; right: 0;
  height: 20px;
  background: var(--cave-ember-900);
  clip-path: polygon(0 0, 100% 0, 95% 100%, 85% 40%, 75% 100%, 65% 40%, 55% 100%, 45% 40%, 35% 100%, 25% 40%, 15% 100%, 5% 40%);
  opacity: 0.3;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 2rem;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.footer-brand svg { width: 28px; height: 28px; }

.footer-brand span {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--limestone-50);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Wraps, and centres when it does — five links in one row is wider than a
   phone, which used to push the whole document into horizontal scroll. */
.footer-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem 2rem;
  list-style: none;
}

.footer-links a {
  font-size: 0.85rem;
  color: var(--text-secondary);
  transition: color 0.3s;
}

.footer-links a:hover { color: var(--limestone-50); }

.footer-copy {
  color: var(--text-secondary);
  font-size: 0.8rem;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .nav-links { display: none; }
  .workflow-step,
  .workflow-step.reverse {
    flex-direction: column;
    align-items: center;
  }
  /* One column, alternation dropped — flipping sides means nothing once
     everything is stacked. Both rows collapse to the same single track. */
  .f-row,
  .f-row:nth-child(even) { grid-template-columns: 1fr; gap: 1.5rem; padding: 2.4rem 0; }
  .f-row > .f-visual,
  .f-row:nth-child(even) > .f-visual { grid-row: 1; grid-column: 1; }
  .f-row > .f-body,
  .f-row:nth-child(even) > .f-body { grid-row: 2; grid-column: 1; }
  .f-visual { justify-items: start; }
  .f-visual svg { width: 68px; height: 68px; }
  .f-visual .icon-mark { width: 76px; height: 76px; }
}

@media (max-width: 900px) {
  .hero { padding-top: 7rem; }
  .hero-shot { padding: 0 1.25rem 3rem; margin-top: 2.5rem; }
  .features-section { padding-top: 4.5rem; }
}

@media (max-width: 600px) {
  .hero h1 { font-size: 2.5rem; letter-spacing: 0.08em; }
  .hero-tagline { font-size: 1rem; }
  .section { padding: 4rem 1.25rem; }
  .btn { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
  .btn-download { padding: 0.9rem 1.9rem; font-size: 0.95rem; }
  .hero-shot-title { display: none; }
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.js .reveal {
  opacity: 0;
  transform: translateY(30px);
}

.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* ===== REDUCED MOTION =====
   The reveals and the dripping stalactites are decorative, so when motion is
   unwelcome the page becomes the still version of itself — nothing is hidden
   and nothing waits on an observer. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
  .js .reveal,
  .js .feature-card {
    opacity: 1 !important;
    transform: none !important;
  }
}
</style>

<body>

<load src="partials/nav.html" />
<load src="partials/hero.html" />
<load src="partials/features.html" />
<load src="partials/workflow.html" />
<load src="partials/cta.html" />
<load src="partials/footer.html" />

<script>
// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('revealed');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.reveal').forEach(el => {
  observer.observe(el);
});



// Label the download button for the visitor's own platform. Falls back to the
// generic "Download for Desktop" already in the markup if detection fails, so
// the button is never blank or wrong-looking without JS.
(() => {
  const label = document.getElementById('heroDownloadLabel');
  if (!label) return;
  const ua = navigator.userAgent;
  const plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  const hay = (plat + ' ' + ua).toLowerCase();
  let os = null;
  if (/mac|darwin/.test(hay) && !/iphone|ipad/.test(hay)) os = 'macOS';
  else if (/win/.test(hay)) os = 'Windows';
  else if (/linux|x11|ubuntu|fedora|debian/.test(hay) && !/android/.test(hay)) os = 'Linux';
  if (os) label.textContent = 'Download for ' + os;
})();

// Fit every scaled-down iframe (the hero app shot and the four dialog
// previews) to the width its container actually got. Each element declares its
// own native width, so one routine handles all of them and nothing is cropped
// horizontally or letterboxed at any viewport size.
(() => {
  const targets = [
    ['.hero-shot-viewport', 1440],
    ['.dialog-preview[data-dialog="01"]', 680],
    ['.dialog-preview[data-dialog="02"]', 1100],
    ['.dialog-preview[data-dialog="03"]', 1000],
    ['.dialog-preview[data-dialog="04"]', 1000],
  ].flatMap(([sel, native]) =>
    [...document.querySelectorAll(sel)].map(box => ({ box, native }))
  );
  if (!targets.length) return;

  const fit = () => {
    for (const { box, native } of targets) {
      const frame = box.querySelector('iframe');
      const w = box.clientWidth;
      if (frame && w) frame.style.transform = 'scale(' + (w / native).toFixed(4) + ')';
    }
  };

  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(fit);
    targets.forEach(({ box }) => ro.observe(box));
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
