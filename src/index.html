/* ===== HERO — copy stack, one action, then the app cropped at the fold ===== */
.hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 40%, var(--basalt-950) 100%);
  overflow: hidden;
  padding-top: 7rem;
}

/* Stalactite shapes hanging from top */
.stalactites {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.stalactite {
  position: absolute;
  top: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--sandstone-200), transparent);
  opacity: 0.15;
}

.stalactite::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 16px solid var(--sandstone-200);
  opacity: 0.4;
}

.stalactite:nth-child(1) { left: 5%; height: 35%; animation: drip 8s ease-in-out infinite; }
.stalactite:nth-child(2) { left: 15%; height: 50%; animation: drip 10s ease-in-out 1s infinite; }
.stalactite:nth-child(3) { left: 25%; height: 28%; animation: drip 7s ease-in-out 2s infinite; }
.stalactite:nth-child(4) { left: 38%; height: 42%; animation: drip 9s ease-in-out 0.5s infinite; }
.stalactite:nth-child(5) { left: 52%; height: 55%; animation: drip 11s ease-in-out 3s infinite; }
.stalactite:nth-child(6) { left: 65%; height: 33%; animation: drip 8s ease-in-out 1.5s infinite; }
.stalactite:nth-child(7) { left: 75%; height: 45%; animation: drip 10s ease-in-out 2.5s infinite; }
.stalactite:nth-child(8) { left: 85%; height: 38%; animation: drip 7s ease-in-out 4s infinite; }
.stalactite:nth-child(9) { left: 92%; height: 60%; animation: drip 12s ease-in-out 1s infinite; }
.stalactite:nth-child(10) { left: 48%; height: 30%; animation: drip 6s ease-in-out 3.5s infinite; }

@keyframes drip {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.08); }
}

/* Crystalline pointed shapes */
.crystal-hang {
  position: absolute;
  top: 0;
  clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
  background: linear-gradient(180deg, rgba(193,160,122,0.06), transparent);
  border-bottom: 1px solid rgba(193,160,122,0.1);
}

.crystal-hang:nth-child(1) { left: 8%; width: 120px; height: 200px; }
.crystal-hang:nth-child(2) { left: 30%; width: 80px; height: 150px; }
.crystal-hang:nth-child(3) { right: 20%; width: 100px; height: 180px; }

.hero-content {

}

}

/* One button, one text link, one reassurance line — stacked, not side by side,
   so the download is unambiguously the primary action. */
/* Wider gap than the copy above needs: it gives the drips hanging off the
   button room to fade before they reach this text. */
.hero-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.2rem;
}

.btn-download {
  padding: 1rem 2.6rem;
  font-size: 1.05rem;
}

/* ── Stalactites growing off the download button ──
   Negative z-index so they paint behind the in-flow content of .hero-content:
   the button's own gradient hides where they attach, and the GitHub link and
   platform line below stay legible where a long one passes behind them. */
.btn-hang {
  position: relative;
  display: inline-block;
}

.btn-drips {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  height: 0;
  z-index: -1;
  pointer-events: none;
}

.btn-drips i,
.hero-drips i,
.clip-drips i {
  position: absolute;
  top: -2px;                     /* tuck the base under the edge it hangs from */
  display: block;
  /* Fallback silhouette; each formation overrides it with its own profile. */
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  /* Solid where it meets the button, fading out toward the tip — the same
     taper the hero's own stalactites use. It is also what keeps the GitHub
     link and platform line readable: a long drip is already faint by the time
     it reaches them. Masking rather than a gradient background so the fade is
     pure alpha and each drip keeps its own flat colour. */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 28%, rgba(0,0,0,0.55) 62%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 0%, #000 28%, rgba(0,0,0,0.55) 62%, transparent 100%);
}

/* ── Hanging into the left edge of the hero ──
   Confined to the leftmost 10% so it frames the copy rather than crowding it.
   Shades sit just above the ember the hero starts on, same reasoning as the
   button's: relief catching a little light, not a graphic element. */
.hero-drips {
  position: absolute;
  top: 0;
  left: 0;
  width: 10%;
  height: 0;
  z-index: 1;
  pointer-events: none;
}

.hero-drips i:nth-child(1) { left:  2%; width: 14px; height: 196px; background: #452F1E; clip-path: polygon(0 0, 100% 0, 74% 40%, 40% 100%, 30% 44%); }
.hero-drips i:nth-child(2) { left: 13%; width:  9px; height:  84px; background: #3E2A1A; clip-path: polygon(0 0, 100% 0, 66% 52%, 58% 100%, 26% 38%); }
.hero-drips i:nth-child(3) { left: 24%; width: 20px; height: 312px; background: #4A3322; clip-path: polygon(0 0, 100% 0, 84% 30%, 62% 66%, 48% 100%, 36% 58%, 14% 26%); }
.hero-drips i:nth-child(4) { left: 39%; width: 11px; height: 132px; background: #422C1C; clip-path: polygon(0 0, 100% 0, 62% 100%, 42% 96%); }
.hero-drips i:nth-child(5) { left: 50%; width:  8px; height:  58px; background: #392619; clip-path: polygon(0 0, 100% 0, 58% 34%, 46% 100%, 38% 40%); }
.hero-drips i:nth-child(6) { left: 60%; width: 16px; height: 244px; background: #503826; clip-path: polygon(0 0, 100% 0, 52% 100%); }

.hero-drips i:nth-child(8) { left: 85%; width: 13px; height: 168px; background: #472F1F; clip-path: polygon(0 0, 100% 0, 70% 100%); }

/* ── Hanging off the bottom of each animated preview ──
   Below the frame, not inside it: the clip sets overflow:hidden to trim the
   screenshot, so anything within it gets trimmed too. The clump is a sibling of
   the clip, hung from its bottom edge, the same reason the button's drips are a
   sibling of the button. One per clip covering about 15% of its width, at a
   different offset on each so they do not line up down the page. */
.clip-drips {
  position: absolute;
  top: calc(100% - 3px);           /* base tucked under the clip's bottom border */
  width: 15%;
  height: 0;
  pointer-events: none;
}

/* Each clump is arranged differently: its own offset, its own number of

/* Clustered in three groups rather than spread evenly — a formation grows in

/* A dim halo behind the label, hero only: it exists to dim the drips hanging off
   the download button. The drips sit at z-index -1 and this comes later in the
   document, so at the same level it paints over them — dimming whatever passes
   behind the text rather than dimming every drip everywhere. The CTA copy of
   this link has nothing behind it, so it gets no halo. */
.hero-actions .ghost-link::before {
  content: '';
  position: absolute;
  inset: -1rem -3rem;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at center,
              rgba(15,9,6,0.82) 0%, rgba(15,9,6,0.66) 38%,
              rgba(15,9,6,0.32) 66%, rgba(15,9,6,0) 100%);
}

.btn-download:focus-visible {

  outline-offset: 4px;
}

.hero-platforms {

  font-family: 'Rajdhani', sans-serif;

  text-transform: uppercase;
  color: var(--text-secondary);
  position: relative;
  opacity: 0.8;
}

   between them rather than mid-item. The tag keeps its own case; "V0.5.0-RC5"

.hero-platforms > span + span::before { content: '\00b7'; margin: 0 0.6em; }

  flex-basis: 100%;
  white-space: normal;
  color: var(--silt-300);
}
.hero-platforms > .hero-meta-warn::before { content: none; }

.hero-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;

}

.hero-platforms::before {
  content: '';
  position: absolute;
  inset: -0.8rem -2.6rem;
  z-index: -1;
  pointer-events: none;

              rgba(15,9,6,0.76) 0%, rgba(15,9,6,0.5) 50%, rgba(15,9,6,0) 100%);
}

/* ===== HERO SHOT — the whole app preview, shown in full ===== */
.hero-shot {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 1240px;
  margin: 3rem auto 0;
  padding: 0 2rem 5rem;
}

.hero-shot-frame {
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: 0 30px 90px rgba(0,0,0,0.75);
}

.hero-shot-bar {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.6rem 0.9rem;
  background: rgba(23,22,21,0.95);
  border-bottom: 1px solid var(--border);
}

.hero-shot-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border-subtle);
  flex: 0 0 auto;
}

.hero-shot-title {
  margin-left: 0.6rem;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: var(--text-secondary);

/* A real screenshot rather than a live iframe: the intrinsic width/height on
   the <img> reserves the right box before it loads, so nothing shifts. */
.hero-shot-viewport { width: 100%; }
.hero-shot-viewport img {
  display: block;
  width: 100%;
  height: auto;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.85rem 2.2rem;
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
  clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
}

.btn-primary {
  background: linear-gradient(90deg, var(--limestone-50), var(--sandstone-200));
  color: var(--basalt-950);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(193,160,122,0.3);
  /* Restate the dark ink. The buttons are anchors, and the global
     `a:hover { color: limestone }` outweighs `.btn-primary` on specificity —
     which turned the label near-white on a near-white gradient on hover. */
  color: var(--basalt-950);
}

.btn-secondary {
  background: transparent;
  color: var(--limestone-50);
  border: 2px solid var(--border-subtle);
  clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
}

.btn-secondary:hover {
  border-color: var(--sandstone-200);
  background: rgba(193,160,122,0.08);
  color: var(--limestone-50);

/* ===== SECTIONS ===== */
.section {
  padding: 6rem 2rem;
  position: relative;
}

.section-header {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 4rem;
}

.section-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.25em;
  margin-bottom: 1rem;
}

.section-header h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--limestone-50);
  margin-bottom: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.section-header p {
  color: var(--text-secondary);
  font-size: 1.05rem;
  line-height: 1.7;
}

/* ===== FEATURES — one colour zone per feature =====
   Each feature owns a full-bleed band of its own colour, and the seam between
   two bands is a row of stalactite points — the same device the CTA and footer
   already use: a strip at the top of the block, filled with the colour *above*
   it, clipped to a polygon. Zones step steadily darker down the page, so
   reading the list feels like going deeper rather than like six flat cards. */
.features-section {
  position: relative;
  background: var(--basalt-950);
  padding: 0;
}

.fs-head {
  text-align: center;
  max-width: 60ch;
  margin: 0 auto;
  padding: 6rem 2rem 3rem;
}
.fs-head h2 {
  font-size: clamp(2rem, 4vw, 2.8rem);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--limestone-50);
}
.fs-head p { color: var(--text-secondary); margin-top: 0.6rem; }

/* The zone. Full width, so the colour band reaches both edges; the content
   inside is what stays on the measure. */
.f-row {
  position: relative;
  background: var(--zone);
  padding: 4rem 0;
}

/* The jagged seam. Sits at the top of each zone carrying the previous zone's
   colour, so the boundary between the two is a row of points. */
.f-row::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 54px;
  background: var(--zone-prev);
  clip-path: polygon(0 0, 100% 0, 100% 30%, 93% 100%, 79% 34%, 64% 100%, 50% 34%, 36% 100%, 21% 34%, 7% 100%, 0 30%);
  pointer-events: none;
  z-index: 0;
}

/* Six steps down from the ember of the hero to near-black at the CTA. The
   first zone's "previous" colour is the basalt the hero ends on. */
.f-row:nth-child(1) { --zone: #2A1E15; --zone-prev: var(--basalt-950); }
.f-row:nth-child(2) { --zone: #241A12; --zone-prev: #2A1E15; }
.f-row:nth-child(3) { --zone: #1E1610; --zone-prev: #241A12; }
.f-row:nth-child(4) { --zone: #18120D; --zone-prev: #1E1610; }
.f-row:nth-child(5) { --zone: #120E0A; --zone-prev: #18120D; }
.f-row:nth-child(6) { --zone: #0C0907; --zone-prev: #120E0A; }

/* Content sits above the seam, and on the measure. */
.f-row-in {
  position: relative;
  z-index: 1;
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 2rem;
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: clamp(2rem, 5vw, 4.5rem);
  align-items: center;
}

.f-row-in > .f-visual { grid-row: 1; grid-column: 1; }
.f-row-in > .f-body   { grid-row: 1; grid-column: 2; }

/* Flip every other row. The track widths swap along with the content, so the
   media always gets the wider column — alternating with `order` alone would
   hand the copy the narrow track on every second row and squash it. DOM order
   is unchanged, so reading order for assistive tech is too. */
.f-row:nth-child(even) .f-row-in { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); }
.f-row:nth-child(even) .f-row-in > .f-visual { grid-column: 2; }
.f-row:nth-child(even) .f-row-in > .f-body   { grid-column: 1; }

/* A media row gives the recording the wider track; a mark row gives it to the
   copy, since a glyph does not need the room. */
.f-row-media .f-row-in { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); }
.f-row-media:nth-child(even) .f-row-in { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }

/* A row with nothing to show gets no visual column — a half-empty row reads as
   a failed image load. Instead its copy is centred in the zone, horizontally and
   vertically, so it reads as an opening statement rather than as a row missing
   its right-hand side.

   The extra top padding is not symmetric by accident: the jagged seam occupies
   the first 54px of every zone, so equal padding would leave this block sitting
   visibly high in its band. */
.f-row-text { padding: 7.5rem 0 5rem; }
.f-row-text .f-row-in { display: block; }
.f-row-text .f-body {
  max-width: 66ch;
  margin: 0 auto;
  text-align: center;
}
.f-row-text .f-head { justify-content: center; }
.f-row-text .f-body p { max-width: 58ch; margin: 0 auto; }

/* No plate — the mark simply centres in its column. Positioned so a formation
   can hang off the bottom of the clip inside it. */
.f-visual { position: relative; display: grid; place-items: center; }
.f-visual svg {
  width: 104px; height: 104px;
  stroke: var(--sandstone-200);
  fill: none;
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.f-visual .icon-mark { width: 116px; height: 116px; }

.f-clip {
  position: relative;
  z-index: 1;                      /* covers where the formation attaches */
  display: block;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;                /* also trims the drips to the frame */
  background: var(--panel);
  box-shadow: 0 18px 50px -24px rgba(0,0,0,0.85);
}
.f-clip picture { display: block; }
.f-clip img { display: block; width: 100%; height: auto; }

/* Every row carries its mark beside the title, since five of six have a
   recording in the visual column and no large glyph to stand in for it. */
.f-head {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  margin-bottom: 0.7rem;
}
.f-head h3 { margin-bottom: 0; }
.f-head .f-head-ico {
  width: 30px; height: 30px;
  flex: 0 0 auto;
  stroke: var(--sandstone-200);
  fill: none;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.f-head .icon-mark { width: 34px; height: 34px; flex: 0 0 auto; }

.f-body h3 {
  font-size: clamp(1.35rem, 2.4vw, 1.75rem);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--limestone-50);
}
.f-body p {
  color: var(--text-secondary);
  font-size: 1.03rem;
  max-width: 56ch;
}

/* Real brand marks ship as monochrome PNGs, so they are masks rather than
   <img> — that way they take the accent colour like the stroked icons. */
.icon-mark {
  display: block;
  background-color: var(--sandstone-200);
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center;  mask-position: center;
  -webkit-mask-size: contain;     mask-size: contain;
}
.icon-speleodb {
  -webkit-mask-image: url('speleodb-logo.png');
  mask-image: url('speleodb-logo.png');
}

/* ===== CTA ===== */
.cta-section {
  text-align: center;
  padding: 8rem 2rem;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 100%);
}

/* Stalactites hanging into CTA */
.cta-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 80px;
  background: #0C0907;                 /* the last feature zone */
  clip-path: polygon(0 0, 100% 0, 90% 100%, 70% 50%, 50% 100%, 30% 50%, 10% 100%);
}

.cta-content {
  position: relative;
  z-index: 2;
  max-width: 600px;
  margin: 0 auto;
}

.cta-content h2 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}

.cta-content p {
  color: var(--silt-300);
  font-size: 1.1rem;
  margin-bottom: 2.5rem;
  line-height: 1.7;
}

/* ── Every file of the release ──
   Three columns ruled off from each other rather than three boxed cards: it is
   a list of files, read like a survey book — name, a dotted leader, the size. */
.dl {
  position: relative;
  z-index: 2;
  max-width: 1080px;
  margin: 0 auto;
  text-align: left;
}

.dl-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

.dl-card {
  position: relative;
  padding: 2rem 2rem 2.2rem;
}
.dl-card + .dl-card { border-left: 1px solid var(--border-subtle); }

/* The visitor's own platform carries the primary button's gradient along its
   top edge, over the rule. */
.dl-card.is-yours::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--limestone-50), var(--sandstone-200));
}

.dl-head {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--sandstone-200);
}
.dl-head svg { flex: 0 0 auto; }
.dl-head h3 {
  font-size: 1.4rem;
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.dl-card.is-yours .dl-head::after {
  content: 'Your system';
  margin-left: auto;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sandstone-200);
}

.dl-arch {
  margin-top: 0.2rem;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.dl-files { list-style: none; margin-top: 1.2rem; }

.dl-file {
  display: flex;
  align-items: baseline;
  gap: 0.55rem;
  padding: 0.5rem 0;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 1.08rem;
  letter-spacing: 0.03em;
  color: var(--limestone-50);
}
.dl-ext { font-weight: 500; font-size: 0.92rem; color: var(--silt-300); white-space: nowrap; }
.dl-lead {
  flex: 1;
  min-width: 1.2rem;
  border-bottom: 1px dotted rgba(243,232,216,0.22);
  transition: border-color 0.3s;
}
.dl-size {
  font-family: 'Barlow', sans-serif;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
  white-space: nowrap;
}
.dl-file::after {
  content: '\2193';
  font-size: 0.9rem;
  color: var(--sandstone-200);
  opacity: 0.55;
  transition: opacity 0.3s, transform 0.3s;
}
.dl-file:hover { color: var(--sandstone-200); }
.dl-file:hover .dl-lead { border-bottom-color: var(--sandstone-200); }
.dl-file:hover::after { opacity: 1; transform: translateY(2px); }
.dl-file:focus-visible,
.dl-copy:focus-visible {
  outline: 2px solid var(--sandstone-200);
  outline-offset: 3px;
}

.dl-note {
  margin-top: 1rem;
  font-size: 0.86rem;
  line-height: 1.6;
  color: var(--text-secondary);
}
.dl-note + .dl-note { margin-top: 0.5rem; }
.dl-note b { font-weight: 600; color: var(--text-primary); }
.dl-warn { color: var(--silt-300); }
.dl-warn b { color: var(--limestone-50); }

.dl-note code,
.dl-cmd code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
}
.dl-note code {
  padding: 0.05em 0.35em;
  background: rgba(243,232,216,0.06);
  color: var(--text-primary);
}

.dl-missing {
  display: block;
  padding: 0.5rem 0;
  font-size: 0.9rem;
  color: var(--silt-300);
}

/* The command wraps rather than scrolls: the copy button is how it is meant to
   be taken, and a wrapped line still selects as one. */
.dl-cmd {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  margin: 0.6rem 0;
  padding: 0.55rem 0.6rem 0.55rem 0.75rem;
  background: rgba(0,0,0,0.28);
  border: 1px solid var(--border);
}
.dl-cmd code {
  flex: 1;
  min-width: 0;
  line-height: 1.55;
  color: var(--limestone-50);
  overflow-wrap: anywhere;
}
/* Only offered where the script that runs it is. */
.dl-copy {
  display: none;
  flex: 0 0 auto;
  padding: 0.35rem 0.55rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sandstone-200);
  background: transparent;
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: color 0.3s, border-color 0.3s;
}
.js .dl-copy { display: inline-block; }
.dl-copy:hover { color: var(--limestone-50); border-color: var(--sandstone-200); }

.dl-foot {
  margin-top: 2.2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.6rem;
  text-align: center;
}

.dl-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  row-gap: 0.45rem;
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.dl-meta > * { white-space: nowrap; }
.dl-meta > * + *::before {
  content: '\00b7';
  margin: 0 0.7em;
  color: var(--text-secondary);
}
.dl-meta .ver { text-transform: none; letter-spacing: 0.08em; }

.dl-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem 2.4rem;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  /* One column, alternation dropped — flipping sides means nothing once
     everything is stacked. Every variant collapses to the same single track. */
  .f-row-in,
  .f-row:nth-child(even) .f-row-in,
  .f-row-media .f-row-in,
  .f-row-media:nth-child(even) .f-row-in {
    grid-template-columns: 1fr;
    gap: 1.5rem;
    padding: 0 1.25rem;
  }
  .f-row-in > .f-visual,
  .f-row:nth-child(even) .f-row-in > .f-visual { grid-row: 1; grid-column: 1; }
  .f-row-in > .f-body,
  .f-row:nth-child(even) .f-row-in > .f-body { grid-row: 2; grid-column: 1; }
  .f-row { padding: 2.8rem 0; }
  .f-row-text { padding: 4.2rem 0 3rem; }
  /* Shorter zones need a shallower seam or the points eat the content. */
  .f-row::before { height: 34px; }
  .f-visual { justify-items: start; }
  .f-visual svg { width: 68px; height: 68px; }
  .f-visual .icon-mark { width: 76px; height: 76px; }
  .fs-head { padding: 4.5rem 1.25rem 2rem; }
  /* Stacked, with the visitor's own platform first. Every card takes the rule
     above it, so moving one to the top cannot leave a rule out of place. */
  .dl-grid { grid-template-columns: 1fr; border-top: 0; }
  .dl-card { padding: 1.7rem 0.25rem 1.9rem; border-top: 1px solid var(--border-subtle); }
  .dl-card + .dl-card { border-left: 0; }
  .dl-card.is-yours { order: -1; }
}

@media (max-width: 900px) {
  .hero { padding-top: 7rem; }
  .hero-shot { padding: 0 1.25rem 3rem; margin-top: 2.5rem; }
  .features-section { padding-top: 4.5rem; }
}

@media (max-width: 600px) {
  .hero h1 { font-size: 2.5rem; letter-spacing: 0.08em; }
  .hero-tagline { font-size: 1rem; }
  .section { padding: 4rem 1.25rem; }
  .btn { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
  .btn-download { padding: 0.9rem 1.9rem; font-size: 0.95rem; }
  .hero-shot-title { display: none; }
  .cta-section { padding: 6rem 1rem; }
  /* These lines wrap on a phone, and a wrapped line would open on a stray dot,
     so the items are spaced apart instead of dotted. */
  .hero-platforms,
  .dl-meta { column-gap: 1.1em; letter-spacing: 0.14em; }
  .hero-platforms > span + span::before,
  .dl-meta > * + *::before { content: none; }
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.js .reveal {
  opacity: 0;
  transform: translateY(30px);
}

.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* ===== REDUCED MOTION =====
   The reveals and the dripping stalactites are decorative, so when motion is
   unwelcome the page becomes the still version of itself — nothing is hidden
   and nothing waits on an observer. */
@media (prefers-reduced-motion: reduce) {
  .js .reveal,
  .js .feature-card {
    opacity: 1 !important;
    transform: none !important;
  }
}

<script>
// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('revealed');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.reveal').forEach(el => {
  observer.observe(el);
});



// Only the feature clip nearest the middle of the viewport animates; the others
// show their first frame. Five looping WebPs decoding at once is wasted work and
// splits attention, and an animated WebP cannot be paused — so the source is
// swapped for the still instead. A clip therefore also downloads its animation
// only once it has actually been looked at.
(() => {
  const imgs = [...document.querySelectorAll('.f-clip img[data-anim]')];
  if (imgs.length < 2) return;
  // Under reduced motion the <picture><source> already serves stills, and a
  // matching <source> beats anything set on the img — nothing to manage here.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Opacity tracks distance from the middle of the viewport, so a clip fades up
  // as it approaches being the closest one and fades back as it leaves. It also
  // hides the handover: the swap between animation and still happens at the
  // moment two clips are equidistant, when both are equally faded, so the change
  // of content is not something you catch.
  const FLOOR = 0.28;         // how dim a clip gets once well away from centre
  const REACH = 0.62;         // fade distance as a fraction of viewport height

  let queued = false;
  const update = () => {
    queued = false;
    const middle = window.innerHeight / 2;
    const reach = window.innerHeight * REACH;
    let winner = null, best = Infinity;
    const dist = new Map();

    for (const img of imgs) {
      const r = img.getBoundingClientRect();
      const d = Math.abs(r.top + r.height / 2 - middle);
      dist.set(img, d);
      if (r.bottom <= 0 || r.top >= window.innerHeight) continue;   // off screen
      if (d < best) { best = d; winner = img; }
    }

    for (const img of imgs) {
      // Smoothstep rather than linear: holds close to full opacity while the
      // clip is near the middle, and does its falling off in the mid distance.
      const t = Math.min(1, dist.get(img) / reach);
      const eased = t * t * (3 - 2 * t);
      // the whole visual, so the formation hanging off the clip dims with it
      img.closest('.f-visual').style.opacity = (1 - eased * (1 - FLOOR)).toFixed(3);

      const want = img === winner ? img.dataset.anim : img.dataset.still;
      // Only assign on a real change; re-assigning would restart the loop.
      if (!img.getAttribute('src').endsWith(want)) img.setAttribute('src', want);
    }
  };
  const onScroll = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();

// Fit every scaled-down iframe (the hero app shot and the four dialog
// previews) to the width its container actually got. Each element declares its
// own native width, so one routine handles all of them and nothing is cropped
// horizontally or letterboxed at any viewport size.
(() => {
  const targets = [
  ].flatMap(([sel, native]) =>
    [...document.querySelectorAll(sel)].map(box => ({ box, native }))
  );
  if (!targets.length) return;

  const fit = () => {
    for (const { box, native } of targets) {
      const frame = box.querySelector('iframe');
      const w = box.clientWidth;
      if (frame && w) frame.style.transform = 'scale(' + (w / native).toFixed(4) + ')';
    }
  };

  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(fit);
    targets.forEach(({ box }) => ro.observe(box));
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
