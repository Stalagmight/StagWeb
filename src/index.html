<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StalagMight — Underwater Cave Survey & Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cave-ember-700: #3A251A; --cave-ember-900: #1A120B; --basalt-950: #0F0906;
  --limestone-50: #F3E8D8; --sandstone-200: #C1A07A; --silt-300: #AE8D67;
  --bg: #0e0d0c; --panel: #171615; --border: #2a2826;
  --text-primary: #d5d0ca; --text-secondary: #858280; --accent: #a89060;
  --warning: #b89848; --error: #b85048; --success: #48986a;
  --border-subtle: rgba(243,232,216,0.18); --border-strong: rgba(243,232,216,0.60);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--basalt-950);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
}

a { color: var(--sandstone-200); text-decoration: none; transition: color 0.3s; }
a:hover { color: var(--limestone-50); }

/* ===== NAV ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 1.2rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15,9,6,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}

.nav::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, rgba(15,9,6,0.6), transparent);
  pointer-events: none;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-brand svg { width: 36px; height: 36px; }

.nav-brand span {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--limestone-50);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.nav-links a {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  position: relative;
  padding: 0.25rem 0;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 50%;
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--sandstone-200);
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.3s;
}

.nav-links a:hover { color: var(--limestone-50); }
.nav-links a:hover::after { opacity: 1; }

/* ===== HERO — Massive top-heavy ===== */
.hero {
  position: relative;
  min-height: 110vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 40%, var(--basalt-950) 100%);
  overflow: hidden;
  padding-top: 5rem;
}

/* Stalactite shapes hanging from top */
.stalactites {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.stalactite {
  position: absolute;
  top: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--sandstone-200), transparent);
  opacity: 0.15;
}

.stalactite::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 16px solid var(--sandstone-200);
  opacity: 0.4;
}

.stalactite:nth-child(1) { left: 5%; height: 35%; animation: drip 8s ease-in-out infinite; }
.stalactite:nth-child(2) { left: 15%; height: 50%; animation: drip 10s ease-in-out 1s infinite; }
.stalactite:nth-child(3) { left: 25%; height: 28%; animation: drip 7s ease-in-out 2s infinite; }
.stalactite:nth-child(4) { left: 38%; height: 42%; animation: drip 9s ease-in-out 0.5s infinite; }
.stalactite:nth-child(5) { left: 52%; height: 55%; animation: drip 11s ease-in-out 3s infinite; }
.stalactite:nth-child(6) { left: 65%; height: 33%; animation: drip 8s ease-in-out 1.5s infinite; }
.stalactite:nth-child(7) { left: 75%; height: 45%; animation: drip 10s ease-in-out 2.5s infinite; }
.stalactite:nth-child(8) { left: 85%; height: 38%; animation: drip 7s ease-in-out 4s infinite; }
.stalactite:nth-child(9) { left: 92%; height: 60%; animation: drip 12s ease-in-out 1s infinite; }
.stalactite:nth-child(10) { left: 48%; height: 30%; animation: drip 6s ease-in-out 3.5s infinite; }

@keyframes drip {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.08); }
}

/* Crystalline pointed shapes */
.crystal-hang {
  position: absolute;
  top: 0;
  clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
  background: linear-gradient(180deg, rgba(193,160,122,0.06), transparent);
  border-bottom: 1px solid rgba(193,160,122,0.1);
}

.crystal-hang:nth-child(1) { left: 8%; width: 120px; height: 200px; }
.crystal-hang:nth-child(2) { left: 30%; width: 80px; height: 150px; }
.crystal-hang:nth-child(3) { right: 20%; width: 100px; height: 180px; }
.crystal-hang:nth-child(4) { right: 5%; width: 60px; height: 130px; }

.hero-content {
  position: relative;
  z-index: 5;
  max-width: 800px;
  padding: 2rem;
}

.hero-mark {
  display: inline-block;
  margin-bottom: 2rem;
}

.hero-mark svg {
  width: 100px; height: 100px;
  filter: drop-shadow(0 0 40px rgba(193,160,122,0.3));
}

.hero h1 {
  font-size: clamp(3.5rem, 8vw, 6rem);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  background: linear-gradient(180deg, var(--limestone-50) 0%, var(--sandstone-200) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 1rem;
}

.hero-tagline {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--silt-300);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

.hero-desc {
  font-size: 1.1rem;
  color: var(--text-secondary);
  max-width: 560px;
  margin: 0 auto 3rem;
  line-height: 1.7;
}

.hero-cta-group {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

/* Pointed bottom edge of hero */
.hero::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 120px;
  background: var(--basalt-950);
  clip-path: polygon(0 100%, 100% 100%, 100% 0, 50% 60%, 0 0);
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.85rem 2.2rem;
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
  clip-path: polygon(0% 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 0% 100%, 10px 50%);
}

.btn-primary {
  background: linear-gradient(90deg, var(--limestone-50), var(--sandstone-200));
  color: var(--basalt-950);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(193,160,122,0.3);
}

.btn-secondary {
  background: transparent;
  color: var(--limestone-50);
  border: 2px solid var(--border-subtle);
  clip-path: polygon(0% 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 0% 100%, 10px 50%);
}

.btn-secondary:hover {
  border-color: var(--sandstone-200);
  background: rgba(193,160,122,0.08);
}

/* ===== SECTIONS ===== */
.section {
  padding: 6rem 2rem;
  position: relative;
}

.section-header {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 4rem;
}

.section-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.25em;
  margin-bottom: 1rem;
}

.section-header h2 {
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--limestone-50);
  margin-bottom: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.section-header p {
  color: var(--text-secondary);
  font-size: 1.05rem;
  line-height: 1.7;
}

/* ===== FEATURES — Hanging from horizontal bar ===== */
.features-section {
  background: var(--bg);
  padding-top: 8rem;
}

.features-bar {
  position: relative;
  max-width: 1200px;
  margin: 0 auto;
}

.features-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--sandstone-200), transparent);
  opacity: 0.4;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  max-width: 1200px;
  margin: 0 auto;
}

.feature-card {
  position: relative;
  padding: 3rem 2rem 2.5rem;
  background: var(--panel);
  border-left: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  transition: all 0.4s ease;
  opacity: 0;
  transform: translateY(-20px);
}

.feature-card.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* Stalactite "drip" connector from bar to card */
.feature-card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 2px; height: 0;
  background: linear-gradient(180deg, var(--sandstone-200), transparent);
  opacity: 0.3;
  transition: height 0.6s ease;
}

.feature-card.revealed::before {
  height: 24px;
}

/* Pointed bottom on each card */
.feature-card::after {
  content: '';
  position: absolute;
  bottom: -16px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 16px solid var(--panel);
  z-index: 2;
  opacity: 0;
  transition: opacity 0.4s 0.3s;
}

.feature-card.revealed::after {
  opacity: 1;
}

.feature-card:last-child {
  border-right: 1px solid var(--border);
}

.feature-card:hover {
  background: rgba(42,40,38,0.6);
  transform: translateY(-4px);
}

.feature-icon {
  width: 48px; height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
  position: relative;
}

.feature-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
  border: 1px solid var(--border-subtle);
  background: rgba(168,144,96,0.04);
}

.feature-icon svg {
  width: 26px; height: 26px;
  stroke: var(--sandstone-200);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.feature-card h3 {
  font-size: 1.2rem;
  color: var(--limestone-50);
  margin-bottom: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.feature-card p {
  color: var(--text-secondary);
  font-size: 0.92rem;
  line-height: 1.65;
}

/* ===== WORKFLOW — Dialog Previews ===== */
.workflow-section {
  background: var(--basalt-950);
  padding: 6rem 2rem 8rem;
  position: relative;
}

/* Pointed top edge */
.workflow-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 60px;
  background: var(--bg);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

.workflow-steps {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 4rem;
}

.workflow-step {
  display: flex;
  align-items: flex-start;
  gap: 3rem;
}

.workflow-step.reverse {
  flex-direction: row-reverse;
}

/* Dialog preview iframe container */
.dialog-preview {
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  position: relative;
}

.dialog-preview iframe {
  border: none;
  display: block;
  transform-origin: top left;
}

/* Dialog #1: 680px native width → scale(0.55) = 374px container */
.dialog-preview[data-dialog="01"] {
  width: 374px;
  height: 385px;
}

.dialog-preview[data-dialog="01"] iframe {
  width: 680px;
  height: 700px;
  transform: scale(0.55);
}

/* Dialog #2: 1100px native → scale(0.55) = 605px container */
.dialog-preview[data-dialog="02"] {
  width: 605px;
  height: 440px;
}

.dialog-preview[data-dialog="02"] iframe {
  width: 1100px;
  height: 800px;
  transform: scale(0.55);
}

/* Dialog #3: 1000px native → scale(0.55) = 550px container */
.dialog-preview[data-dialog="03"] {
  width: 550px;
  height: 385px;
}

.dialog-preview[data-dialog="03"] iframe {
  width: 1000px;
  height: 700px;
  transform: scale(0.55);
}

/* Dialog #4: 1000px native → scale(0.55) = 550px container */
.dialog-preview[data-dialog="04"] {
  width: 550px;
  height: 385px;
}

.dialog-preview[data-dialog="04"] iframe {
  width: 1000px;
  height: 700px;
  transform: scale(0.55);
}

/* Step info text */
.workflow-step-info {
  flex: 1;
  padding-top: 1rem;
}

.workflow-step-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--limestone-50);
  background: var(--cave-ember-900);
  border: 1px solid var(--sandstone-200);
  clip-path: polygon(50% 100%, 0% 20%, 0% 0%, 100% 0%, 100% 20%);
  padding-bottom: 8px;
  margin-bottom: 1rem;
}

.workflow-step-info h3 {
  font-size: 1.3rem;
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.75rem;
}

.workflow-step-info p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  line-height: 1.7;
}

/* ===== HIGHLIGHTS ===== */
.highlights-section {
  background: var(--panel);
  padding: 6rem 2rem;
  position: relative;
}

.highlights-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 40px;
  background: var(--basalt-950);
  clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
}

/* App preview frame */
.app-preview-frame {
  max-width: 1100px;
  margin: 0 auto;
  opacity: 0;
  transform: translateY(20px);
}
.app-preview-frame.revealed {
  opacity: 1;
  transform: translateY(0);
}

/* App preview iframe container — 1440×900 native scaled to 1100px wide */
.app-preview-container {
  width: 1100px;
  max-width: 100%;
  height: 688px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  position: relative;
}
.app-preview-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 1440px;
  height: 900px;
  border: none;
  transform-origin: top left;
  transform: scale(0.764);
  pointer-events: none;
}

/* ===== CTA ===== */
.cta-section {
  text-align: center;
  padding: 8rem 2rem;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--cave-ember-700) 0%, var(--cave-ember-900) 100%);
}

/* Stalactites hanging into CTA */
.cta-section::before {
  content: '';
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 80px;
  background: var(--panel);
  clip-path: polygon(0 0, 100% 0, 90% 100%, 70% 50%, 50% 100%, 30% 50%, 10% 100%);
}

.cta-content {
  position: relative;
  z-index: 2;
  max-width: 600px;
  margin: 0 auto;
}

.cta-content h2 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}

.cta-content p {
  color: var(--silt-300);
  font-size: 1.1rem;
  margin-bottom: 2.5rem;
  line-height: 1.7;
}

.cta-buttons {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

.cta-platforms {
  display: flex;
  gap: 2rem;
  justify-content: center;
  margin-top: 2rem;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.cta-platforms span {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

/* ===== FOOTER ===== */
.footer {
  background: var(--basalt-950);
  border-top: 1px solid var(--border);
  padding: 3rem 2rem;
  position: relative;
}

.footer::before {
  content: '';
  position: absolute;
  top: -20px; left: 0; right: 0;
  height: 20px;
  background: var(--cave-ember-900);
  clip-path: polygon(0 0, 100% 0, 95% 100%, 85% 40%, 75% 100%, 65% 40%, 55% 100%, 45% 40%, 35% 100%, 25% 40%, 15% 100%, 5% 40%);
  opacity: 0.3;
}

.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 2rem;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.footer-brand svg { width: 28px; height: 28px; }

.footer-brand span {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--limestone-50);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.footer-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.footer-links a {
  font-size: 0.85rem;
  color: var(--text-secondary);
  transition: color 0.3s;
}

.footer-links a:hover { color: var(--limestone-50); }

.footer-copy {
  color: var(--text-secondary);
  font-size: 0.8rem;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .features-grid { grid-template-columns: 1fr; }
  .highlights-grid { grid-template-columns: 1fr; }
  .nav-links { display: none; }
  .workflow-step,
  .workflow-step.reverse {
    flex-direction: column;
    align-items: center;
  }
  .dialog-preview {
    max-width: 100%;
  }
  .dialog-preview[data-dialog="02"] {
    width: 100%;
    max-width: 605px;
  }
}

@media (max-width: 600px) {
  .hero h1 { font-size: 2.5rem; letter-spacing: 0.08em; }
  .hero-tagline { font-size: 1rem; }
  .section { padding: 4rem 1.25rem; }
  .btn { padding: 0.75rem 1.5rem; font-size: 0.9rem; }
}

/* ===== SCROLL REVEAL ===== */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>
<body>

<load src="partials/nav.html" />
<load src="partials/hero.html" />
<load src="partials/features.html" />
<load src="partials/workflow.html" />
<load src="partials/highlights.html" />
<load src="partials/cta.html" />
<load src="partials/footer.html" />

<script>
// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('revealed');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

document.querySelectorAll('.reveal, .feature-card, .highlight-card').forEach(el => {
  observer.observe(el);
});
</script>
</body>
</html>
