<style>
/* ===== RELEASES ===== */
.rel-page {
  background: linear-gradient(180deg, var(--cave-ember-900) 0, var(--basalt-950) 32rem);
  min-height: 100vh;
}

.rel {
  max-width: 880px;
  margin: 0 auto;
  padding: 9rem 2rem 6rem;
}

.rel-head h1 {
  font-size: clamp(2.4rem, 5vw, 3.6rem);
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.rel-head p {
  margin-top: 0.8rem;
  max-width: 60ch;
  color: var(--silt-300);
  font-size: 1.05rem;
}

.rel-list { margin-top: 3rem; }

/* Only claims to be loading where something is loading it. */
.rel-status { color: var(--text-secondary); padding: 2rem 0; border-top: 1px solid var(--border-subtle); }
.rel-loading { display: none; }
.js .rel-loading { display: block; }

/* ── One version ── */
.rel-version {
  padding: 2.6rem 0 3rem;
  border-top: 1px solid var(--border-subtle);
  scroll-margin-top: 6rem;
}

.rel-vhead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
}
.rel-vhead h2 {
  font-size: 2.3rem;
  color: var(--limestone-50);
  letter-spacing: 0.04em;
}
.rel-vhead h2 a { color: inherit; }
.rel-vhead h2 a:hover { color: var(--sandstone-200); }
.rel-vhead time { color: var(--text-secondary); font-size: 0.9rem; }

.rel-badge {
  align-self: center;
  padding: 0.3rem 0.65rem 0.25rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--silt-300);
  border: 1px solid var(--border-subtle);
}
.rel-badge.is-stable {
  color: var(--basalt-950);
  background: linear-gradient(90deg, var(--limestone-50), var(--sandstone-200));
  border-color: transparent;
}

.rel-sub {
  margin: 2rem 0 0.6rem;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* ── Builds: one disclosure per tag ── */
.rel-builds { border-bottom: 1px solid var(--border); }

.rel-build,
.rel-more { border-top: 1px solid var(--border); scroll-margin-top: 6rem; }

.rel-build > summary,
.rel-more > summary {
  display: flex;
  align-items: baseline;
  gap: 0.9rem;
  padding: 0.8rem 0;
  list-style: none;
  cursor: pointer;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: 0.03em;
  color: var(--limestone-50);
}
.rel-build > summary::-webkit-details-marker,
.rel-more > summary::-webkit-details-marker { display: none; }
.rel-build > summary::before,
.rel-more > summary::before {
  content: '\25B8';
  color: var(--sandstone-200);
  transition: transform 0.2s;
}
.rel-build[open] > summary::before,
.rel-more[open] > summary::before { transform: rotate(90deg); }
.rel-build > summary:hover,
.rel-more > summary:hover { color: var(--sandstone-200); }
.rel-build > summary:focus-visible,
.rel-more > summary:focus-visible {
  outline: 2px solid var(--sandstone-200);
  outline-offset: 2px;
}

.rel-ch {
  font-weight: 500;
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--silt-300);
}
.rel-build > summary time {
  margin-left: auto;
  font-family: 'Barlow', sans-serif;
  font-weight: 400;
  font-size: 0.85rem;
  letter-spacing: 0;
  color: var(--text-secondary);
}

.rel-files {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.2rem 2.4rem;
  padding: 0.4rem 0 1rem 1.5rem;
}
.rel-os h4 {
  margin-bottom: 0.3rem;
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.rel-os ul { list-style: none; }

/* The same ledger line as the download grid on the main page. */
.rel-file {
  display: flex;
  align-items: baseline;
  gap: 0.55rem;
  padding: 0.3rem 0;
  font-size: 0.9rem;
  color: var(--sandstone-200);
}
.rel-fname { min-width: 0; overflow-wrap: anywhere; }
.rel-lead {
  flex: 1;
  min-width: 1rem;
  border-bottom: 1px dotted rgba(243,232,216,0.18);
}
.rel-fsize {
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
  white-space: nowrap;
}
.rel-file:hover { color: var(--limestone-50); }
.rel-file:hover .rel-lead { border-bottom-color: var(--sandstone-200); }

.rel-gh {
  display: inline-block;
  margin: 0 0 1.2rem 1.5rem;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.04em;
  color: var(--silt-300);
}
.rel-gh:hover { color: var(--limestone-50); }
.rel-none { padding: 0 0 1rem 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }

.ver { font-variant-numeric: tabular-nums; }

/* ── Release notes, as GitHub renders them ── */
.rel-notes {
  max-width: 72ch;
  color: var(--text-primary);
  line-height: 1.7;
}
.rel-more .rel-notes { padding: 0.2rem 0 1.6rem 1.5rem; }
.rel-notes > * + * { margin-top: 1rem; }
.rel-notes h1,
.rel-notes h2,
.rel-notes h3 {
  margin-top: 2.4rem;
  font-size: 1.35rem;
  color: var(--limestone-50);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.rel-notes h4,
.rel-notes h5,
.rel-notes h6 {
  margin-top: 1.8rem;
  font-size: 1.12rem;
  color: var(--sandstone-200);
  letter-spacing: 0.04em;
}
.rel-notes ul,
.rel-notes ol { padding-left: 1.3rem; }
.rel-notes li + li { margin-top: 0.5rem; }
.rel-notes li > ul,
.rel-notes li > ol { margin-top: 0.5rem; }
.rel-notes li::marker { color: var(--sandstone-200); }
.rel-notes strong { font-weight: 600; color: var(--limestone-50); }
.rel-notes a {
  color: var(--sandstone-200);
  text-decoration: underline;
  text-decoration-color: rgba(193,160,122,0.35);
  text-underline-offset: 2px;
}
.rel-notes a:hover { color: var(--limestone-50); text-decoration-color: currentColor; }
.rel-notes code,
.rel-notes kbd,
.rel-notes pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.84em;
}
.rel-notes code,
.rel-notes kbd {
  padding: 0.1em 0.35em;
  background: rgba(243,232,216,0.06);
  overflow-wrap: anywhere;
}
.rel-notes kbd { border: 1px solid var(--border-subtle); border-bottom-width: 2px; }
.rel-notes pre {
  padding: 0.9rem 1rem;
  overflow-x: auto;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  line-height: 1.55;
}
.rel-notes pre code { padding: 0; background: none; overflow-wrap: normal; }
.rel-notes blockquote {
  padding: 0.3rem 0 0.3rem 1rem;
  border-left: 2px solid var(--sandstone-200);
  color: var(--silt-300);
}
.rel-notes blockquote strong { color: var(--limestone-50); }
.rel-notes hr { border: 0; border-top: 1px solid var(--border-subtle); margin: 2.2rem 0; }
.rel-notes img { max-width: 100%; height: auto; }
.rel-notes table { display: block; overflow-x: auto; border-collapse: collapse; }
.rel-notes th,
.rel-notes td { padding: 0.4rem 0.7rem; border: 1px solid var(--border); text-align: left; }

@media (max-width: 600px) {
  .rel { padding: 7rem 1rem 4rem; }
  .rel-vhead h2 { font-size: 1.9rem; }
  .rel-files,
  .rel-more .rel-notes { padding-left: 0; }
  .rel-files { grid-template-columns: 1fr; }
  .rel-gh { margin-left: 0; }
  .rel-none { padding-left: 0; }
}
</style>
</head>

<!-- Filled in by js/changelog.js from GitHub, one entry per version. -->

    </header>
    <div class="rel-list" id="releases">
      <p class="rel-status rel-loading">Loading releases&hellip;</p>
      <noscript><p class="rel-status">The list needs JavaScript. Every release is also on <a href="https://github.com/Stalagmight/Stalagmight/releases">GitHub</a>.</p></noscript>
    </div>
  </div>
</main>
